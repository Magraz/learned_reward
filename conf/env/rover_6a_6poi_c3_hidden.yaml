# @package _global_
# Rover domain: 6 rovers, 6 POIs of coupling 3 on two concentric rings around
# the arena centre (7, 7), every POI worth 1.0:
#   - inner ring, radius 2.5, at 90 / 210 / 330 degrees (POIs 0-2): slow, rate
#     0.01, so 100 coupled steps each, as many as the episode has steps: an
#     inner POI is never used up, and the episode always runs to the limit;
#   - outer ring, radius 6.0, at 30 / 150 / 270 degrees (POIs 3-5): fast, rate
#     0.2, so 5 coupled steps each.
# The rings are offset by 60 degrees: neighbouring inner and outer POIs are
# 5.22 apart, centre to centre, and no POI disc touches the spawn box.
# The arena is 14 x 14 (not the default 10 x 10) so that the outer ring fits
# with the spawn box still at the centre: the bottom POI's disc touches the
# lower wall. Two POIs can be worked at once, so the team must split into two
# teams of 3. Everything else is the default rover_4a_2poi_c2.
defaults:
  - rover_6a_6poi_c3_ord_hidden
  - _self_

env:
  pois:
    enforce_order: false
