# @package _global_
# Rover domain: the one-rover version of rover_2a_3poi_c2_implicit. Same
# arena, spawn and POI layout; 1 rover and every coupling 1, so the task keeps
# the visiting order and drops the coordination. "012" names that order
# (rover_1a_3poi_c1_implicit is the one-rover version of a different layout).
# Collecting every POI's value (6.0) within the 100 steps is possible only by
# using the POIs up in the order 0 -> 1 -> 2:
#   P0, the corner behind the spawn, first;
#   P1, the POI nearest the spawn, second (going there first is the trap);
#   P2, the far corner, last.
# Why: one rover works one POI at a time, so using everything up takes
# 12 + 24 + 24 = 60 paying steps (value / rate) in every order, leaving 40
# steps of travel. Order 0-1-2 needs 32-35 of them (it finishes at step
# 93-96, scripted route policy); every other order needs at least 41, for any
# policy, nearest-first (1-0-2) included. Checked on 1000 spawn seeds with a
# lower bound: straight-line travel between disc edges, the entering step
# counted as paying, a heading-limited start, return trips through discs
# already visited allowed.
# Inherits the arena, spawn, radius and rate from the 2-rover group; `entries`
# replaces the whole list, so the layout is restated here.
defaults:
  - rover_2a_3poi_c2_implicit
  - _self_

env:
  n_agents: 1
  pois:
    entries:
      - {position: [1.0, 1.0], coupling: 1, value: 1.2}     # 12 steps, first
      - {position: [7.75, 4.0], coupling: 1, value: 2.4}    # 24 steps, second (nearest)
      - {position: [13.0, 13.0], coupling: 1, value: 2.4}   # 24 steps, last
