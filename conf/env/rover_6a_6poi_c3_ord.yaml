# @package _global_
# Rover domain: rover_6a_6poi_c3 (two rings around (7, 7), 6 rovers, coupling
# 3) with a strict order: the fast outer POIs first (3, 4, 5 = orders 0-2),
# then the slow inner ones (0, 1, 2 = orders 3-5). One POI pays at a time.
# Inner POI 0 needs 100 coupled steps and is never used up, so POIs 1 and 2
# never unlock: the most a team can collect is 3 plus POI 0's 0.01 per step
# (the scripted plan in ROUTE_PLANS collects 3.59-3.66).
defaults:
  - rover_6a_6poi_c3
  - _self_

env:
  pois:
    entries:
      - {position: [7.0, 9.5], coupling: 3, rate: 0.01, order: 3}
      - {position: [4.835, 5.75], coupling: 3, rate: 0.01, order: 4}
      - {position: [9.165, 5.75], coupling: 3, rate: 0.01, order: 5}
      - {position: [12.196, 10.0], coupling: 3, rate: 0.2, order: 0}
      - {position: [1.804, 10.0], coupling: 3, rate: 0.2, order: 1}
      - {position: [7.0, 1.0], coupling: 3, rate: 0.2, order: 2}
