# @package _global_
# Rover domain: 6 rovers, 6 POIs of coupling 3 on a ring of radius 3.5 around
# the arena centre (60 degrees apart). Two POIs can be worked at once, so the
# team must split in halves and cover the ring in three rounds.
# Everything else is the default rover_2poi_c2.
defaults:
  - rover_6a_6poi_c3
  - _self_

env:
  pois:
    entries:
      - {position: [7.0, 9.5], coupling: 3, rate: 0.01, order: 3}
      - {position: [4.835, 5.75], coupling: 3, rate: 0.01, order: 4}
      - {position: [9.165, 5.75], coupling: 3, rate: 0.01, order: 5}
      - {position: [12.196, 10.0], coupling: 3, rate: 0.2, order: 0}
      - {position: [1.804, 10.0], coupling: 3, rate: 0.2, order: 1}
      - {position: [7.0, 1.0], coupling: 3, rate: 0.2, order: 2}
