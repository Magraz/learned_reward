# @package _global_
# rover_4a_4poi_c4_implicit_20x20_ord_hidden with the env's global state published: rover positions, POI
# positions and POI remaining budgets, 20 values (4 rovers, 4 POIs).
# The task is unchanged; the critic reads the global state instead of the
# concatenated observations.
# The rmappo_jax POI manager (model=rmappo_manager) needs the global state.
defaults:
  - rover_4a_4poi_c4_implicit_20x20_ord_hidden
  - _self_

env:
  global_state: true
