# @package _global_
defaults:
  - rover_4a_2poi_c2
  - _self_

env:
  n_agents: 1
  max_steps: 100
  world_size: [20.0, 20.0]
  spawn_region: [9.5, 10.5, 9.5, 10.5]   # small, so every seed has the same best order
  pois:
    type: static
    radius: 1.0
    entries:
      # 4x4 grid with alternating POI kinds; each takes 20 steps to consume.
      - {position: [2.5, 2.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [7.5, 2.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [12.5, 2.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [17.5, 2.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [2.5, 7.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [7.5, 7.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [12.5, 7.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [17.5, 7.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [2.5, 12.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [7.5, 12.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [12.5, 12.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [17.5, 12.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [2.5, 17.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [7.5, 17.5], coupling: 1, value: 5.0, rate: 0.25}
      - {position: [12.5, 17.5], coupling: 1, value: 1.0, rate: 0.05, radius: 2.0}
      - {position: [17.5, 17.5], coupling: 1, value: 5.0, rate: 0.25}
