# @package _global_
# rover_2a_4poi_c2_implicit_20x20_ord with the env's global state published: rover positions, POI
# positions and POI remaining budgets, 16 values (2 rovers, 4 POIs).
# The task is unchanged; the critic reads the global state instead of the
