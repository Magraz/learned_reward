# @package _global_
# rover_1a_3poi_c1_implicit with the best visiting order made explicit: POI 2
# first, then POI 1, then POI 0. POI 1 is never used up within the episode, so
# POI 0 never unlocks.
defaults:
  - rover_1a_3poi_c1_implicit
  - _self_

env:
  pois:
    entries:
      - {position: [5.0, 4.0], coupling: 1, radius: 1.25, value: 1.0, rate: 0.01, order: 2}
      - {position: [2.0, 6.0], coupling: 1, radius: 0.75, value: 3.0, rate: 0.02, order: 1}
      - {position: [9.0, 9.0], coupling: 1, radius: 0.5, value: 6.0, rate: 0.1, order: 0}
