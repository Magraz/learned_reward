# @package _global_
# rover_2a_3poi_c2_implicit with the env's global state published (rover
# positions, POI positions, POI remaining budgets; 13 values at 2 rovers and
# 3 POIs). The task is unchanged. The critic reads the global state instead of
# the concatenated observations, and the rmappo_jax POI manager
# (`model=rmappo_manager`) can run on it. Train `model=rmappo` here as the
# baseline without a manager, so both arms' critics read the same input.
defaults:
  - rover_2a_3poi_c2_implicit
  - _self_

env:
  global_state: true
