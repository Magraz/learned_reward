# @package _global_
# Rover domain, DEFAULT variant: 2 POIs, each needing 2 rovers at once.
#
# Pure-JAX, physics-free 2D world (environments/rover). Trains with the JAX
# stacks only (`algorithm=mappo_jax` or `rmappo_jax`; the default `mappo` cannot
# build it). Outside training, build it with
# environments.rover.config.load_rover_env("rover_2poi_c2").
#
# Other rover_* variants inherit this file (`defaults: [rover_2poi_c2, _self_]`)
# and override only what differs; a `pois.entries` override replaces the list.
# Every key below is checked by make_rover_env, so a typo raises.
env:
  environment: rover
  # vmap width of the JAX collectors (a hyperparameter: batch = n_steps * n_envs),
  # read by the runners, ignored by the env. Keep it equal across compared arms.
  n_envs: 32
  n_agents: 4
  max_steps: 100
  world_size: [10.0, 10.0]           # arena width, height
  spawn_region: [4.0, 6.0, 4.0, 6.0] # x_min, x_max, y_min, y_max (uniform)
  dynamics:
    max_speed: 0.5                   # distance per step at speed action +1
    max_turn: 0.7853981633974483     # pi/4 rad per step at |turn action| = 1
  observation:
    type: sector_density             # 8 agent + 8 POI heading-relative sectors
    n_sectors: 8
    sensor_radius: null              # null = arena diagonal (sense everything)
  reward:
    type: coupling_depletion         # team reward; POIs pay until used up
    # What every rover trains on: shared_reward (the team reward, one team
    # value in the critic) or difference_rewards (each rover's own D_i).
    # Evaluation scores the team reward under both. The mode is not in the
    # results path: give each mode its own env group.
    mode: shared_reward
  pois:
    type: static
    radius: 1.0                      # defaults for every entry below
    value: 1.0                       # total reward a POI can pay per episode
    rate: 0.1                       # paid per step while coupling is met
    # true: a POI pays only once every POI of a lower `order` is used up.
    # false: `order` locks no reward and acts only through
    # hide_until_unlocked (reveal POIs in order, score the unordered task).
    enforce_order: true
    hide_until_unlocked: false       # true: hidden until its order is reached
    # false: a used-up POI is still sensed, exactly like a live one.
    # true: hidden once used up (the rule of every run before 2026-11-04;
    # pass it to evaluate or view those runs). Not in the results path.
    hide_when_used_up: false
    # An entry may also set `order` (integer >= 0, default 0), its temporal
    # coupling: its order is reached once every POI of a lower order is used
    # up, and (with enforce_order) it pays only from then on. Equal orders
    # (the default) leave the POIs free to be used in any order.
    # An entry may override `hide_until_unlocked`: a flagged POI is not sensed
    # until its order is reached. A POI of the lowest order always has its
    # order reached, so both order flags act only on a POI with a higher
    # order. An entry may also override `enforce_order` and
    # `hide_when_used_up`. None of these flags is in the results path: give a
    # layout with a different setting its own env group.
    entries:
      - {position: [2.0, 8.0], coupling: 2}
      - {position: [8.0, 2.0], coupling: 2}
